services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.8.36
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: scrapelog_admin
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_ADMIN_PASSWORD:?set CLICKHOUSE_ADMIN_PASSWORD in .env}
      CLICKHOUSE_INGEST_PASSWORD: ${CLICKHOUSE_INGEST_PASSWORD:?set CLICKHOUSE_INGEST_PASSWORD in .env}
      CLICKHOUSE_READER_PASSWORD: ${CLICKHOUSE_READER_PASSWORD:?set CLICKHOUSE_READER_PASSWORD in .env}
      BACKUP_S3_URL: ${BACKUP_S3_URL:-}
      BACKUP_S3_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      BACKUP_S3_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/config.d/low-memory.xml:/etc/clickhouse-server/config.d/low-memory.xml:ro
      - ./clickhouse/config.d/backup-s3.xml:/etc/clickhouse-server/config.d/backup-s3.xml:ro
      - ./clickhouse/users.d/users.xml:/etc/clickhouse-server/users.d/users.xml:ro
      - ./clickhouse/initdb:/docker-entrypoint-initdb.d:ro
    mem_limit: 6g
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    networks:
      - scrapelog
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://$$(hostname -i):8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  ingest-api:
    build: ./ingest-api
    restart: unless-stopped
    environment:
      CLICKHOUSE_URL: ${CLICKHOUSE_URL:-}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-}
      CLICKHOUSE_INGEST_USER: ${CLICKHOUSE_INGEST_USER:-}
      CLICKHOUSE_INGEST_PASSWORD: ${CLICKHOUSE_INGEST_PASSWORD:?set CLICKHOUSE_INGEST_PASSWORD in .env}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN in .env}
      MAX_BATCH_RECORDS: ${MAX_BATCH_RECORDS:-}
      MAX_REQUEST_BYTES: ${MAX_REQUEST_BYTES:-}
      REDACT_HEADERS: ${REDACT_HEADERS:-}
    ports:
      - "127.0.0.1:${INGEST_API_PORT:-8080}:8080"
    depends_on:
      clickhouse:
        condition: service_healthy
    networks:
      - scrapelog
    healthcheck:
      test: ["CMD", "/scrapelog", "healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  grafana:
    image: grafana/grafana:13.3.0
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000/}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_PLUGINS_PREINSTALL_SYNC: grafana-clickhouse-datasource@4.23.4
      CLICKHOUSE_READER_PASSWORD: ${CLICKHOUSE_READER_PASSWORD:?set CLICKHOUSE_READER_PASSWORD in .env}
    ports:
      - 127.0.0.1:${GRAFANA_PORT:-3000}:3000
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources/clickhouse.yml:/etc/grafana/provisioning/datasources/clickhouse.yml:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    networks:
      - scrapelog
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 60s

networks:
  scrapelog: {}

volumes:
  clickhouse_data: {}
  grafana_data: {}
