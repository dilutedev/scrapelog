services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.8.36
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: scrapelog_admin
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_ADMIN_PASSWORD:?set CLICKHOUSE_ADMIN_PASSWORD in .env}
      CLICKHOUSE_INGEST_PASSWORD: ${CLICKHOUSE_INGEST_PASSWORD:?set CLICKHOUSE_INGEST_PASSWORD in .env}
      CLICKHOUSE_READER_PASSWORD: ${CLICKHOUSE_READER_PASSWORD:?set CLICKHOUSE_READER_PASSWORD in .env}
      CLICKHOUSE_ARCHIVER_PASSWORD: ${CLICKHOUSE_ARCHIVER_PASSWORD:?set CLICKHOUSE_ARCHIVER_PASSWORD in .env}
      ARCHIVE_S3_URL: ${S3_ENDPOINT:-}/${S3_BUCKET:-}/archive/requests/
      ARCHIVE_S3_GRANT: GRANT READ, WRITE ON S3('${S3_ENDPOINT:-}/${S3_BUCKET:-}/archive/requests/.*')
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      BACKUP_S3_URL: ${BACKUP_S3_URL:-}
      BACKUP_S3_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      BACKUP_S3_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/config.d/low-memory.xml:/etc/clickhouse-server/config.d/low-memory.xml:ro
      - ./clickhouse/config.d/backup-s3.xml:/etc/clickhouse-server/config.d/backup-s3.xml:ro
      - ./clickhouse/config.d/archive-s3.xml:/etc/clickhouse-server/config.d/archive-s3.xml:ro
      - ./clickhouse/users.d/users.xml:/etc/clickhouse-server/users.d/users.xml:ro
      - ./clickhouse/initdb:/docker-entrypoint-initdb.d:ro
    mem_limit: 6g
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    networks:
      - scrapelog
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://$$(hostname -i):8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  ingest-api:
    build: ./ingest-api
    restart: unless-stopped
    stop_grace_period: 15s
    environment:
      CLICKHOUSE_URL: ${CLICKHOUSE_URL:-}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-}
      CLICKHOUSE_INGEST_USER: ${CLICKHOUSE_INGEST_USER:-}
      CLICKHOUSE_INGEST_PASSWORD: ${CLICKHOUSE_INGEST_PASSWORD:?set CLICKHOUSE_INGEST_PASSWORD in .env}
      CLICKHOUSE_READER_USER: ${CLICKHOUSE_READER_USER:-}
      CLICKHOUSE_READER_PASSWORD: ${CLICKHOUSE_READER_PASSWORD:?set CLICKHOUSE_READER_PASSWORD in .env}
      CLICKHOUSE_ARCHIVER_USER: ${CLICKHOUSE_ARCHIVER_USER:-}
      CLICKHOUSE_ARCHIVER_PASSWORD: ${CLICKHOUSE_ARCHIVER_PASSWORD:?set CLICKHOUSE_ARCHIVER_PASSWORD in .env}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN in .env}
      SCRAPELOG_PUBLIC_URL: ${SCRAPELOG_PUBLIC_URL:-}
      MAX_BATCH_RECORDS: ${MAX_BATCH_RECORDS:-}
      CLICKHOUSE_DISK_BUDGET_BYTES: ${CLICKHOUSE_DISK_BUDGET_BYTES:-}
      RATE_LIMIT_RECORDS_PER_MINUTE: ${RATE_LIMIT_RECORDS_PER_MINUTE:-}
      MAX_REQUEST_BYTES: ${MAX_REQUEST_BYTES:-}
      MAX_BODY_BYTES: ${MAX_BODY_BYTES:-}
      REDACT_HEADERS: ${REDACT_HEADERS:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_REGION: ${S3_REGION:-}
      S3_BODY_PREFIX: ${S3_BODY_PREFIX:-}
    ports:
      - "127.0.0.1:${INGEST_API_PORT:-8080}:8080"
    depends_on:
      clickhouse:
        condition: service_healthy
    networks:
      - scrapelog
    healthcheck:
      test: ["CMD", "/scrapelog", "healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

networks:
  scrapelog: {}

volumes:
  clickhouse_data: {}
