services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.8.36
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: scrapelog_admin
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_ADMIN_PASSWORD:?set CLICKHOUSE_ADMIN_PASSWORD in .env}
      CLICKHOUSE_INGEST_PASSWORD: ${CLICKHOUSE_INGEST_PASSWORD:?set CLICKHOUSE_INGEST_PASSWORD in .env}
      CLICKHOUSE_READER_PASSWORD: ${CLICKHOUSE_READER_PASSWORD:?set CLICKHOUSE_READER_PASSWORD in .env}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/config.d/low-memory.xml:/etc/clickhouse-server/config.d/low-memory.xml:ro
      - ./clickhouse/users.d/users.xml:/etc/clickhouse-server/users.d/users.xml:ro
      - ./clickhouse/initdb:/docker-entrypoint-initdb.d:ro
    mem_limit: 6g
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    networks:
      - scrapelog
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://$$(hostname -i):8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  ingest-api:
    build: ./ingest-api
    restart: unless-stopped
    environment:
      CLICKHOUSE_URL: ${CLICKHOUSE_URL:-}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-}
      CLICKHOUSE_INGEST_USER: ${CLICKHOUSE_INGEST_USER:-}
      CLICKHOUSE_INGEST_PASSWORD: ${CLICKHOUSE_INGEST_PASSWORD:?set CLICKHOUSE_INGEST_PASSWORD in .env}
    ports:
      - "127.0.0.1:${INGEST_API_PORT:-8080}:8080"
    depends_on:
      clickhouse:
        condition: service_healthy
    networks:
      - scrapelog
    healthcheck:
      test: ["CMD", "/scrapelog", "healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

networks:
  scrapelog: {}

volumes:
  clickhouse_data: {}
