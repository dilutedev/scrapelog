<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Archive · scrapelog</title>
<link rel="stylesheet" href="/assets/{{.AssetVersion}}/app.css">
<script type="module" src="/assets/{{.AssetVersion}}/archive.js"></script>
</head>
<body>
{{template "topbar" .}}
<main class="archive">
<h1>Archive</h1>
<p id="archive-error" class="query-error" role="alert" hidden></p>
<p id="archive-disabled" hidden>Archiving is off. Set S3_ENDPOINT, S3_BUCKET and the S3 keys to archive requests to S3.</p>
<section id="archive-sections" hidden>
<h2>Archived days</h2>
<ul id="archive-list" class="rule-list"></ul>
<p id="archives-empty" hidden>No days have been archived yet.</p>
<h2>Restore</h2>
<form id="restore-form" class="rule-form">
<label for="restore-from">From day (UTC)</label>
<input id="restore-from" type="date" required>
<label for="restore-to">To day (UTC), inclusive</label>
<input id="restore-to" type="date" required>
<label for="restore-project">Project (optional)</label>
<input id="restore-project">
<label for="restore-domain">Domain (optional)</label>
<input id="restore-domain">
<div class="editor-actions">
<button type="submit">Estimate</button>
<button type="button" id="start-restore" disabled>Restore</button>
</div>
<p id="restore-estimate" aria-live="polite" hidden></p>
<p id="restore-error" class="query-error" role="alert" hidden></p>
</form>
<h2>Restores</h2>
<p id="restores-error" class="query-error" role="alert" hidden></p>
<ul id="restore-list" class="rule-list"></ul>
<p id="restores-empty" hidden>No restores.</p>
</section>
</main>
</body>
</html>
