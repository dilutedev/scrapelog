{{define "topbar"}}<header class="topbar" data-permissions="{{.PermissionList}}">
<span class="brand"><img class="brand-mark" src="/assets/{{.AssetVersion}}/icon.svg" alt="" width="24" height="24">scrapelog</span>
<nav aria-label="Sections">
{{range .NavigationLinks}}<a href="{{.Path}}" aria-current="{{if .Current}}page{{else}}false{{end}}">{{if eq .Path "/requests"}}<svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>{{else if eq .Path "/bandwidth"}}<svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>{{else if eq .Path "/alerts"}}<svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16v-5a6 6 0 1 1 12 0v5l2 2H4zM10 21h4"/></svg>{{else if eq .Path "/archive"}}<svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18v4H3zM5 9v10h14V9M10 13h4"/></svg>{{end}}<span class="nav-label">{{.Label}}</span></a>{{end}}
</nav>
<details class="account-menu">
<summary><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg><span class="nav-label">Account</span></summary>
<div class="account-menu-panel">
<span class="topbar-user" title="{{.Username}}">{{.Username}}</span>
{{if .IsAdmin}}<a href="/users" aria-current="{{if eq .Page "users"}}page{{else}}false{{end}}">Users</a>{{end}}
{{if .IsAdmin}}<a href="/projects" aria-current="{{if eq .Page "projects"}}page{{else}}false{{end}}">Projects</a>{{end}}
<button type="button" id="theme-toggle" aria-pressed="false">Dark mode</button>
<button type="button" id="sign-out">Sign out</button>
</div>
</details>
</header>
<script type="module" src="/assets/{{.AssetVersion}}/shell.js"></script>
{{end}}
