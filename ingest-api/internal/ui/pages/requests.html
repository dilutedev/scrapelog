<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Requests · scrapelog</title>
<link rel="stylesheet" href="/assets/{{.AssetVersion}}/app.css">
<script type="module" src="/assets/{{.AssetVersion}}/requests.js"></script>
</head>
<body>
{{template "topbar" .}}
<main class="explorer">
<form id="query-form" class="query-bar" role="search">
<div class="query-input-wrap">
<label for="query-input" class="visually-hidden">Filter query</label>
<input id="query-input" name="q" type="text" autocomplete="off" spellcheck="false" role="combobox" aria-expanded="false" aria-controls="query-suggestions" aria-autocomplete="list" placeholder="status:403 domain:shop.example.com">
<ul id="query-suggestions" role="listbox" hidden></ul>
</div>
<label for="range-select" class="visually-hidden">Time range</label>
<select id="range-select">
<option value="15m">Last 15 minutes</option>
<option value="1h">Last hour</option>
<option value="6h">Last 6 hours</option>
<option value="24h">Last 24 hours</option>
<option value="7d">Last 7 days</option>
<option value="14d">Last 14 days</option>
<option value="30d">Last 30 days</option>
<option value="60d">Last 60 days</option>
<option value="custom" hidden>Custom range</option>
</select>
<button type="submit">Search</button>
</form>
<p id="query-error" class="query-error" role="alert" hidden></p>
<section class="tape" aria-label="Status share over time">
<div id="tape-chart"></div>
<div id="tape-axis" class="tape-axis"></div>
<p id="tape-message" class="tape-message" hidden></p>
</section>
<p id="retention-note" class="note" hidden></p>
<div id="explorer-body" class="explorer-body">
<section class="results" aria-label="Requests">
<table class="results-table"><tbody id="results-rows"></tbody></table>
<p id="results-empty" hidden>No requests match this query in this time range.</p>
<button type="button" id="load-older" hidden>Load older</button>
</section>
<aside id="detail-pane" class="detail-pane" aria-label="Request detail" hidden></aside>
</div>
</main>
</body>
</html>
