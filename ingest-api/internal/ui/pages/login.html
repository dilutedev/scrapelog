<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · scrapelog</title>
<link rel="stylesheet" href="/assets/{{.AssetVersion}}/app.css">
<script type="module" src="/assets/{{.AssetVersion}}/login.js"></script>
</head>
<body>
<main class="login">
<h1>scrapelog</h1>
<form id="login-form" method="post">
<label for="login-username">Username</label>
<input id="login-username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
<label for="login-password">Password</label>
<input id="login-password" name="password" type="password" autocomplete="current-password" required>
<p id="login-error" role="alert" hidden></p>
<button type="submit">Sign in</button>
</form>
</main>
</body>
</html>
