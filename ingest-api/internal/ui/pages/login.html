<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · scrapelog</title>
<link rel="stylesheet" href="/assets/{{.AssetVersion}}/app.css">
<script type="module" src="/assets/{{.AssetVersion}}/login.js"></script>
</head>
<body>
<main class="login">
<h1>scrapelog</h1>
<form id="login-form" method="post">
<label for="admin-token">Admin token</label>
<input id="admin-token" name="token" type="password" autocomplete="current-password" required autofocus>
<p id="login-error" role="alert" hidden></p>
<button type="submit">Sign in</button>
</form>
</main>
</body>
</html>
