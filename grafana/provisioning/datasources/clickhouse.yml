apiVersion: 1
datasources:
  - name: ClickHouse
    uid: clickhouse
    type: grafana-clickhouse-datasource
    isDefault: true
    jsonData:
      host: clickhouse
      port: 9000
      protocol: native
      username: grafana_reader
      defaultDatabase: scrapelog
      queryTimeout: "55"
    secureJsonData:
      password: $CLICKHOUSE_READER_PASSWORD
